# ===================== SERVIDOR =====================
# Puerto donde va a correr la API (http://localhost:8080)
server.port=8080

# ===================== BASE DE DATOS =====================
# Cambia "easymenu_db" por el nombre real de tu base de datos en MySQL/XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/easymenu_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE =====================
# "update" hace que Hibernate cree/actualice las tablas automáticamente
# según tus entidades (@Entity), sin que tengas que escribir el SQL a mano.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL que Hibernate va ejecutando (útil para aprender/depurar)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico para que Hibernate genere SQL compatible con MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
