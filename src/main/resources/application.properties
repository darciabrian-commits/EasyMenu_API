# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Limitación local por instancia para las rutas públicas de pedidos
easymenu.rate-limit.pedido-creacion.max-requests=${PEDIDO_RATE_LIMIT_MAX_REQUESTS:30}
easymenu.rate-limit.pedido-publico.max-requests=${PEDIDO_PUBLIC_RATE_LIMIT_MAX_REQUESTS:60}
easymenu.rate-limit.window-seconds=${PEDIDO_RATE_LIMIT_WINDOW_SECONDS:60}
# Solo confiar X-Forwarded-For cuando la conexión directa procede de estos CIDR.
easymenu.rate-limit.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}

# JWT
# JWT_SECRET must be Base64-encoded random key material; generate production keys with:
# openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# Administrador inicial opcional (solo se crea si la tabla de usuarios esta vacia)
easymenu.initial-admin.email=${EASYMENU_INITIAL_ADMIN_EMAIL:}
easymenu.initial-admin.password=${EASYMENU_INITIAL_ADMIN_PASSWORD:}

# Puerto
server.port=${PORT:8080}

logging.level.org.springframework.security=INFO